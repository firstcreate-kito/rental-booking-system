name: Demo bootstrap

# 販売促進用デモ環境を GitHub 上でまるごと立ち上げる（PC不要）。
# D1作成 → wrangler.jsonc へID注入 → マイグレーション → デモ用シード投入 → デプロイ まで自動。
# 何度実行しても安全（D1は既存を再利用、シードは spaces が空の初回のみ／reseed=yes で強制）。
#
# デモ環境は APP_ENV=demo：実メール送信オフ／Googleカレンダー書き込みオフ。決済のみ Stripe テストモード。
# 初回はこの後「Demo secrets」で Stripe テスト鍵を投入してください。
on:
  workflow_dispatch:
    inputs:
      reseed:
        description: 'シードを強制再投入する（初回以外は no）'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']

concurrency:
  group: demo-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve or create demo D1
        id: d1
        run: |
          set -e
          # 既存なら再利用、無ければ作成（create はエラーでも無視）
          npx wrangler d1 create albe_booking_demo 2>/dev/null || true
          ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="albe_booking_demo") | (.uuid // .database_id)' | head -1)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::demo D1 の作成/取得に失敗しました。CloudflareトークンにAccount→D1→Editの権限が必要です。"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "demo D1 id: $ID"

      - name: Inject D1 id into wrangler.jsonc
        run: |
          sed -i "s/PLACEHOLDER_DEMO_D1_ID/${{ steps.d1.outputs.id }}/g" wrangler.jsonc
          grep -n "albe_booking_demo" -A1 wrangler.jsonc || true

      - name: Apply migrations (demo)
        run: npx wrangler d1 migrations apply albe_booking_demo --remote --env demo

      - name: Seed if empty (demo)
        run: |
          set -e
          CNT=$(npx wrangler d1 execute albe_booking_demo --remote --env demo --json \
                --command "SELECT COUNT(*) AS c FROM spaces" | jq -r '.[0].results[0].c // 0')
          echo "spaces count: $CNT / reseed=${{ github.event.inputs.reseed }}"
          if [ "$CNT" = "0" ] || [ "${{ github.event.inputs.reseed }}" = "yes" ]; then
            # 標準シード（スペース・オプション・チケット・発行者）＋デモ専用データ（デモ会員/管理者/クーポン/ポイント）
            npx wrangler d1 execute albe_booking_demo --remote --env demo --file=./seeds/seed.sql
            npx wrangler d1 execute albe_booking_demo --remote --env demo --file=./seeds/options.sql
            npx wrangler d1 execute albe_booking_demo --remote --env demo --file=./seeds/tickets.sql
            npx wrangler d1 execute albe_booking_demo --remote --env demo --file=./seeds/issuer.sql
            npx wrangler d1 execute albe_booking_demo --remote --env demo --file=./seeds/demo.sql
          else
            echo "seed skip（既にデータあり）"
          fi

      - name: Deploy (demo)
        run: npx wrangler deploy --env demo
