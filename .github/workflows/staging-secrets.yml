name: Staging secrets

# ステージング（テスト環境）のシークレット（鍵）を GitHub の画面だけで投入する（PC不要）。
# GitHub → Settings → Secrets に「◯◯_STAGING」という名前で値を登録しておき、
# GitHub → Actions → 「Staging secrets」→ Run workflow を押すと、
# 登録済みの値だけをステージングWorkerに投入し、最後に再デプロイする。
#
# 例）STRIPE_SECRET_KEY_STAGING = sk_test_...  を登録 → 実行 → Stripeがテストモードになる。
#
# ⚠️ 安全装置：本番キー（sk_live... / PAYPAL_MODE=live）を誤って指定した場合はエラーで止まる。
on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: '投入後にステージングを再デプロイする（通常は yes）'
        type: choice
        required: true
        default: 'yes'
        options: ['yes', 'no']

concurrency:
  group: staging-secrets
  cancel-in-progress: false

jobs:
  put-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ── ステージングに入れたい値（GitHub Secrets に登録されたものだけ投入される）──
      # 決済（Stripeテスト）
      STRIPE_SECRET_KEY_STAGING: ${{ secrets.STRIPE_SECRET_KEY_STAGING }}
      STRIPE_WEBHOOK_SECRET_STAGING: ${{ secrets.STRIPE_WEBHOOK_SECRET_STAGING }}
      # 決済（PayPalサンドボックス）
      PAYPAL_CLIENT_ID_STAGING: ${{ secrets.PAYPAL_CLIENT_ID_STAGING }}
      PAYPAL_CLIENT_SECRET_STAGING: ${{ secrets.PAYPAL_CLIENT_SECRET_STAGING }}
      PAYPAL_MODE_STAGING: ${{ secrets.PAYPAL_MODE_STAGING }}
      # メール送信（Resend）※テスト予約の確認メールを飛ばしたい場合
      RESEND_API_KEY_STAGING: ${{ secrets.RESEND_API_KEY_STAGING }}
      MAIL_FROM_STAGING: ${{ secrets.MAIL_FROM_STAGING }}
      MAIL_ADMIN_STAGING: ${{ secrets.MAIL_ADMIN_STAGING }}
      # 公開ゲート（Basic認証）※テスト環境を関係者だけに見せたい場合
      BASIC_AUTH_USER_STAGING: ${{ secrets.BASIC_AUTH_USER_STAGING }}
      BASIC_AUTH_PASS_STAGING: ${{ secrets.BASIC_AUTH_PASS_STAGING }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本番キーの誤投入をブロック（ステージングにはテストキーのみ）
      - name: Guard against production keys
        run: |
          set -e
          if printf '%s' "$STRIPE_SECRET_KEY_STAGING" | grep -q '^sk_live'; then
            echo "::error::STRIPE_SECRET_KEY_STAGING に本番キー(sk_live...)が指定されています。テストキー(sk_test...)を使ってください。"; exit 1
          fi
          MODE=$(printf '%s' "$PAYPAL_MODE_STAGING" | tr '[:upper:]' '[:lower:]')
          if [ "$MODE" = "live" ] || [ "$MODE" = "production" ]; then
            echo "::error::PAYPAL_MODE_STAGING が live/production です。ステージングでは sandbox を指定してください。"; exit 1
          fi

      # deploy には有効なステージングD1のIDが必要（リポジトリ内はプレースホルダのため実IDへ差し替え）
      - name: Resolve staging D1 id
        id: d1
        run: |
          set -e
          ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="albe_booking_staging") | (.uuid // .database_id)' | head -1)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::ステージング用D1が見つかりません。先に「Staging bootstrap」を1回実行してください。"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Inject D1 id into wrangler.jsonc
        run: sed -i "s/PLACEHOLDER_STAGING_D1_ID/${{ steps.d1.outputs.id }}/g" wrangler.jsonc

      - name: Put secrets (staging)
        run: |
          set -e
          # 値が登録されている鍵だけを投入。未登録はスキップ（値そのものはログに出さない）。
          put() {
            name="$1"; val="$2"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" --env staging >/dev/null
              echo "✓ $name を投入しました"
            else
              echo "· $name は未登録（スキップ）"
            fi
          }
          put STRIPE_SECRET_KEY      "$STRIPE_SECRET_KEY_STAGING"
          put STRIPE_WEBHOOK_SECRET  "$STRIPE_WEBHOOK_SECRET_STAGING"
          put PAYPAL_CLIENT_ID       "$PAYPAL_CLIENT_ID_STAGING"
          put PAYPAL_CLIENT_SECRET   "$PAYPAL_CLIENT_SECRET_STAGING"
          put PAYPAL_MODE            "$PAYPAL_MODE_STAGING"
          put RESEND_API_KEY         "$RESEND_API_KEY_STAGING"
          put MAIL_FROM              "$MAIL_FROM_STAGING"
          put MAIL_ADMIN             "$MAIL_ADMIN_STAGING"
          put BASIC_AUTH_USER        "$BASIC_AUTH_USER_STAGING"
          put BASIC_AUTH_PASS        "$BASIC_AUTH_PASS_STAGING"

      - name: Deploy (staging)
        if: ${{ github.event.inputs.redeploy == 'yes' }}
        run: npx wrangler deploy --env staging
