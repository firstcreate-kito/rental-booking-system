name: Staging bootstrap

# ステージング（テスト環境）を GitHub 上でまるごと立ち上げる（PC不要）。
# D1作成 → wrangler.jsonc へID注入 → マイグレーション → 初回シード → デプロイ まで自動。
# 何度実行しても安全（D1は既存を再利用、シードは spaces が空の初回のみ投入）。
on:
  workflow_dispatch:
    inputs:
      reseed:
        description: 'シードを強制再投入する（通常は no）'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']

concurrency:
  group: staging-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve or create staging D1
        id: d1
        run: |
          set -e
          # 既存なら再利用、無ければ作成（create はエラーでも無視）
          npx wrangler d1 create albe_booking_staging || true
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="albe_booking_staging") | (.uuid // .database_id)' | head -1)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::staging D1 の作成/取得に失敗しました"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "staging D1 id: $ID"

      - name: Inject D1 id into wrangler.jsonc
        run: |
          sed -i "s/PLACEHOLDER_STAGING_D1_ID/${{ steps.d1.outputs.id }}/g" wrangler.jsonc
          grep -n "albe_booking_staging" -A1 wrangler.jsonc || true

      - name: Apply migrations (staging)
        run: npx wrangler d1 migrations apply albe_booking_staging --remote --env staging

      - name: Seed if empty (staging)
        run: |
          set -e
          CNT=$(npx wrangler d1 execute albe_booking_staging --remote --env staging --json \
                --command "SELECT COUNT(*) AS c FROM spaces" | jq -r '.[0].results[0].c // 0')
          echo "spaces count: $CNT / reseed=${{ github.event.inputs.reseed }}"
          if [ "$CNT" = "0" ] || [ "${{ github.event.inputs.reseed }}" = "yes" ]; then
            npm run db:seed:staging
          else
            echo "seed skip（既にデータあり）"
          fi

      - name: Deploy (staging)
        run: npx wrangler deploy --env staging
