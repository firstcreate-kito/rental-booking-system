<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALBE お支払い</title>
<style>
  :root { --brand:#1f6feb; --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:40px 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 24px; text-align:center; }
  .icon { font-size:52px; line-height:1; }
  h1 { font-size:20px; margin:14px 0 6px; }
  p { color:var(--muted); font-size:14px; margin:6px 0; }
  .num { font-size:18px; font-weight:700; letter-spacing:.02em; margin:10px 0; }
  .btn { display:inline-block; margin-top:18px; background:var(--brand); color:#fff; border:0; border-radius:9px; padding:11px 20px; font-size:15px; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .warnbox { background:#fff8e6; border:1px solid #f0c36d; color:#a15c00; border-radius:10px; padding:12px; font-size:13px; margin-top:14px; text-align:left; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="card" id="box">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">確認しています…</h1>
    <p id="msg">お支払いの結果を確認しています。少しお待ちください。</p>
    <div class="num hidden" id="numLine"></div>
    <div class="warnbox hidden" id="warn"></div>
    <a class="btn hidden" id="homeBtn" href="/">トップへ戻る</a>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const type = q.get('type');
const status = q.get('status');
const session = q.get('session');
const num = q.get('num');
const $ = id => document.getElementById(id);
function show(icon, title, msg, opts) {
  opts = opts || {};
  $('icon').textContent = icon;
  $('title').textContent = title;
  $('msg').textContent = msg;
  if (opts.num) { $('numLine').textContent = '予約番号：' + opts.num; $('numLine').classList.remove('hidden'); }
  if (opts.warn) { $('warn').textContent = opts.warn; $('warn').classList.remove('hidden'); }
  $('homeBtn').classList.remove('hidden');
}

async function run() {
  // キャンセルで戻ってきた場合
  if (status === 'cancel') {
    show('⚠️', 'お支払いが中断されました',
      'ご予約自体は「未入金」の状態で確保されています。',
      { num, warn: 'お手数ですが、お支払いは改めて店舗までお問い合わせいただくか、後日ご案内するお支払い方法にてお願いいたします。' });
    return;
  }
  // 予約のカード決済（成功で戻ってきた）
  if (type === 'booking' && session) {
    for (let i = 0; i < 12; i++) {
      const r = await fetch('/api/bookings/payment-status?session=' + encodeURIComponent(session));
      const j = await r.json().catch(() => ({}));
      if (j.status === 'paid') {
        show('✅', 'お支払いが完了しました', 'ご予約とお支払いが確定しました。確認メールをお送りします。');
        return;
      }
      await new Promise(res => setTimeout(res, 1500));
    }
    // 反映待ち（Webhookが少し遅れている場合）
    show('✅', 'お支払いを受け付けました', 'ご予約は確定しています。反映まで少しお時間がかかる場合があります。');
    return;
  }
  // それ以外
  show('ℹ️', '状態を確認できませんでした', 'お手数ですが、ご予約状況は確認メールまたは店舗までご確認ください。');
}
run();
</script>
</body>
</html>
