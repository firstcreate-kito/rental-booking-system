name: Production secrets

# 本番（booking.space-albe.com）のシークレット（鍵）を GitHub の画面だけで投入する（PC不要）。
# GitHub → Settings → Secrets に「◯◯_PROD」という名前で本番の値を登録しておき、
# GitHub → Actions → 「Production secrets」→ Run workflow で confirm に「YES-PRODUCTION」を選んで実行。
# 登録済みの値だけを本番Workerに投入する（コードの再デプロイはしない＝現行の本番コードに鍵だけ反映）。
#
# ⚠️ 本番はお客様の実売上に影響します。事故防止のため：
#   - confirm=YES-PRODUCTION を選ばないと実行できない
#   - テスト用の値（sk_test... / PAYPAL_MODE=sandbox）が指定されたらエラーで止まる
#   - コードは再デプロイしない（secret put は現行バージョンに鍵だけ反映される）
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '本番に鍵を投入します。実行するには YES-PRODUCTION を選択'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'YES-PRODUCTION']

concurrency:
  group: production-secrets
  cancel-in-progress: false

jobs:
  put-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ── 本番に入れたい値（GitHub Secrets に登録されたものだけ投入される）──
      # 決済（Stripe本番）
      STRIPE_SECRET_KEY_PROD: ${{ secrets.STRIPE_SECRET_KEY_PROD }}
      STRIPE_WEBHOOK_SECRET_PROD: ${{ secrets.STRIPE_WEBHOOK_SECRET_PROD }}
      # 決済（PayPal本番＝Live）
      PAYPAL_CLIENT_ID_PROD: ${{ secrets.PAYPAL_CLIENT_ID_PROD }}
      PAYPAL_CLIENT_SECRET_PROD: ${{ secrets.PAYPAL_CLIENT_SECRET_PROD }}
      PAYPAL_MODE_PROD: ${{ secrets.PAYPAL_MODE_PROD }}
    steps:
      - name: Confirm gate
        run: |
          set -e
          if [ "${{ github.event.inputs.confirm }}" != "YES-PRODUCTION" ]; then
            echo "::error::confirm に YES-PRODUCTION が選択されていません。安全のため中止します。"; exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # テスト用の値を本番に入れる誤りをブロック（本番は Live のみ）
      - name: Guard against test values
        run: |
          set -e
          if printf '%s' "$STRIPE_SECRET_KEY_PROD" | grep -q '^sk_test'; then
            echo "::error::STRIPE_SECRET_KEY_PROD にテストキー(sk_test...)が指定されています。本番キー(sk_live...)を使ってください。"; exit 1
          fi
          if [ -n "$PAYPAL_MODE_PROD" ]; then
            MODE=$(printf '%s' "$PAYPAL_MODE_PROD" | tr '[:upper:]' '[:lower:]')
            if [ "$MODE" != "live" ]; then
              echo "::error::PAYPAL_MODE_PROD は 'live' を指定してください（本番）。現在: $PAYPAL_MODE_PROD"; exit 1
            fi
          fi

      - name: Put secrets (production)
        run: |
          set -e
          # 値が登録されている鍵だけを本番Workerに投入。未登録はスキップ（値はログに出さない）。
          # secret put は現行の本番バージョンに鍵だけを反映する（ローカルのコードは配信しない）。
          put() {
            name="$1"; val="$2"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" >/dev/null
              echo "✓ $name を本番に投入しました"
            else
              echo "· $name は未登録（スキップ）"
            fi
          }
          put STRIPE_SECRET_KEY      "$STRIPE_SECRET_KEY_PROD"
          put STRIPE_WEBHOOK_SECRET  "$STRIPE_WEBHOOK_SECRET_PROD"
          put PAYPAL_CLIENT_ID       "$PAYPAL_CLIENT_ID_PROD"
          put PAYPAL_CLIENT_SECRET   "$PAYPAL_CLIENT_SECRET_PROD"
          put PAYPAL_MODE            "$PAYPAL_MODE_PROD"

      - name: Done
        run: |
          echo "本番の鍵投入が完了しました。secret put により現行バージョンへ即時反映されています。"
          echo "管理画面『システム状態』で PayPal決済 = 本番(live) を確認してください。"
