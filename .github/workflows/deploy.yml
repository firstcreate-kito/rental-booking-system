name: Deploy

# 自宅・外出先のブラウザ（スマホ可）からデプロイするためのワークフロー。
# GitHub → Actions → 「Deploy」→ Run workflow → environment を選んで実行。
# 開発PCや wrangler のローカル環境は不要（すべてGitHubのクラウド上で実行）。
#
# 【運用ルール：ステージング先行】どんなに小さな修正でも、必ず
#   ① environment=staging でデプロイ → ② ステージングURLで確認 → ③ environment=production
# の順で行う。本番デプロイは staging_verified=yes を選ばないと実行できない（下のガード参照）。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'デプロイ先'
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production
      staging_verified:
        description: '本番のみ必須：ステージングで確認済みか（production を選ぶ場合は yes）'
        type: choice
        required: true
        default: 'no'
        options: ['no', 'yes']

# 同一環境への同時デプロイを防ぐ（後発が待つ）
concurrency:
  group: deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # 【ステージング先行の徹底】本番は「ステージングで確認済み」を明示しないと止める
      - name: Enforce staging-first for production
        if: ${{ github.event.inputs.environment == 'production' && github.event.inputs.staging_verified != 'yes' }}
        run: |
          echo "::error::本番デプロイには staging_verified=yes が必要です。まず environment=staging でデプロイして動作確認し、その後 environment=production かつ staging_verified=yes で実行してください（ステージング先行ルール）。"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 壊れたコードを本番/ステージングに出さないための安全ゲート
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Deploy (${{ github.event.inputs.environment }})
        run: |
          set -e
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "▶ 本番へデプロイします"
            npx wrangler deploy
          else
            echo "▶ ステージングへデプロイします"
            # wrangler.jsonc の staging D1 はリポジトリ上はプレースホルダのため、実IDを解決して注入する
            # （bootstrap / secrets ワークフローと同じ手順。これが無いと code:10021 で失敗する）
            ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="albe_booking_staging") | (.uuid // .database_id)' | head -1)
            if [ -z "$ID" ] || [ "$ID" = "null" ]; then
              echo "::error::ステージング用D1が見つかりません。先に「Staging bootstrap」を実行してください。"; exit 1
            fi
            sed -i "s/PLACEHOLDER_STAGING_D1_ID/$ID/g" wrangler.jsonc
            npx wrangler deploy --env staging
          fi
