name: Demo secrets

# 販売促進用デモ環境のシークレット（鍵）を GitHub の画面だけで投入する（PC不要）。
# GitHub → Settings → Secrets に「◯◯_DEMO」で登録 → Actions →「Demo secrets」→ Run。
# 登録済みの値だけをデモWorkerに投入し、最後に再デプロイする。
#
# デモは APP_ENV=demo：実メール送信オフ／カレンダー書き込みオフ（コード側ガード）。
# 決済のみ Stripe テストモードで有効化するため、テスト鍵(sk_test.../whsec_...)を入れる。
# 事業者に見せるため BASIC_AUTH_USER/PASS で共有パスワードゲートを掛ける（推奨）。
#
# ⚠️ 安全装置：本番キー(sk_live...)を指定した場合はエラーで止まる（デモはテスト鍵のみ）。
on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: '投入後にデモを再デプロイする（通常は yes）'
        type: choice
        required: true
        default: 'yes'
        options: ['yes', 'no']

concurrency:
  group: demo-secrets
  cancel-in-progress: false

jobs:
  put-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # ── デモに入れたい値（GitHub Secrets に登録されたものだけ投入される）──
      # 決済（Stripeテスト・テストカードで擬似決済）
      STRIPE_SECRET_KEY_DEMO: ${{ secrets.STRIPE_SECRET_KEY_DEMO }}
      STRIPE_WEBHOOK_SECRET_DEMO: ${{ secrets.STRIPE_WEBHOOK_SECRET_DEMO }}
      # 決済（PayPalサンドボックス）※任意
      PAYPAL_CLIENT_ID_DEMO: ${{ secrets.PAYPAL_CLIENT_ID_DEMO }}
      PAYPAL_CLIENT_SECRET_DEMO: ${{ secrets.PAYPAL_CLIENT_SECRET_DEMO }}
      PAYPAL_MODE_DEMO: ${{ secrets.PAYPAL_MODE_DEMO }}
      # 公開ゲート（Basic認証）※事業者へ配る共有ID/パスワード（推奨）
      BASIC_AUTH_USER_DEMO: ${{ secrets.BASIC_AUTH_USER_DEMO }}
      BASIC_AUTH_PASS_DEMO: ${{ secrets.BASIC_AUTH_PASS_DEMO }}
      # ※メール(Resend)・Googleカレンダー・SwitchBot はデモでは使わない（副作用オフ）ため投入しない。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 本番キーの誤投入をブロック（デモにはテストキーのみ）
      - name: Guard against production keys
        run: |
          set -e
          if printf '%s' "$STRIPE_SECRET_KEY_DEMO" | grep -q '^sk_live'; then
            echo "::error::STRIPE_SECRET_KEY_DEMO に本番キー(sk_live...)が指定されています。テストキー(sk_test...)を使ってください。"; exit 1
          fi
          MODE=$(printf '%s' "$PAYPAL_MODE_DEMO" | tr '[:upper:]' '[:lower:]')
          if [ "$MODE" = "live" ] || [ "$MODE" = "production" ]; then
            echo "::error::PAYPAL_MODE_DEMO が live/production です。デモでは sandbox を指定してください。"; exit 1
          fi

      - name: Resolve demo D1 id
        id: d1
        run: |
          set -e
          ID=$(npx wrangler d1 list --json 2>/dev/null | jq -r '.[]? | select(.name=="albe_booking_demo") | (.uuid // .database_id)' | head -1)
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::デモ用D1が見つかりません。先に「Demo bootstrap」を1回実行してください。"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Inject D1 id into wrangler.jsonc
        run: sed -i "s/PLACEHOLDER_DEMO_D1_ID/${{ steps.d1.outputs.id }}/g" wrangler.jsonc

      - name: Put secrets (demo)
        run: |
          set -e
          # 値が登録されている鍵だけを投入。未登録はスキップ（値そのものはログに出さない）。
          put() {
            name="$1"; val="$2"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$name" --env demo >/dev/null
              echo "✓ $name を投入しました"
            else
              echo "· $name は未登録（スキップ）"
            fi
          }
          put STRIPE_SECRET_KEY      "$STRIPE_SECRET_KEY_DEMO"
          put STRIPE_WEBHOOK_SECRET  "$STRIPE_WEBHOOK_SECRET_DEMO"
          put PAYPAL_CLIENT_ID       "$PAYPAL_CLIENT_ID_DEMO"
          put PAYPAL_CLIENT_SECRET   "$PAYPAL_CLIENT_SECRET_DEMO"
          put PAYPAL_MODE            "$PAYPAL_MODE_DEMO"
          put BASIC_AUTH_USER        "$BASIC_AUTH_USER_DEMO"
          put BASIC_AUTH_PASS        "$BASIC_AUTH_PASS_DEMO"

      - name: Deploy (demo)
        if: ${{ github.event.inputs.redeploy == 'yes' }}
        run: npx wrangler deploy --env demo
