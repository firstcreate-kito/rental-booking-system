<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALBE お支払い</title>
<style>
  :root { --brand:#1f6feb; --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#f7f8fa; --ok:#16a34a; --warn:#f59e0b; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; color:var(--ink); background:var(--bg); line-height:1.7; }
  main { max-width:560px; margin:0 auto; padding:40px 20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:28px 24px; text-align:center; }
  .icon { font-size:52px; line-height:1; }
  h1 { font-size:20px; margin:14px 0 6px; }
  p { color:var(--muted); font-size:14px; margin:6px 0; }
  .num { font-size:22px; font-weight:800; letter-spacing:.02em; color:var(--brand); margin:12px 0 2px; }
  .num-label { font-size:12px; color:var(--muted); }
  .details { text-align:left; border:1px solid var(--line); border-radius:10px; margin:16px 0 4px; overflow:hidden; }
  .details .row { display:flex; justify-content:space-between; gap:12px; padding:10px 14px; font-size:14px; border-top:1px solid var(--line); }
  .details .row:first-child { border-top:0; }
  .details .k { color:var(--muted); flex:0 0 auto; }
  .details .v { text-align:right; font-weight:600; }
  .details .total .v { color:var(--brand); font-size:16px; }
  .btn { display:inline-block; background:var(--brand); color:#fff; border:0; border-radius:9px; padding:11px 20px; font-size:15px; cursor:pointer; text-decoration:none; }
  .btn.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  .btnrow { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
  .warnbox { background:#fff8e6; border:1px solid #f0c36d; color:#a15c00; border-radius:10px; padding:12px; font-size:13px; margin-top:14px; text-align:left; }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="card" id="box">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">確認しています…</h1>
    <p id="msg">お支払いの結果を確認しています。少しお待ちください。</p>
    <div class="hidden" id="numWrap"><div class="num-label">予約番号</div><div class="num" id="numLine"></div></div>
    <div class="details hidden" id="details"></div>
    <div class="warnbox hidden" id="warn"></div>
    <div class="btnrow hidden" id="btnRow">
      <a class="btn ghost" href="/">トップへ戻る</a>
      <a class="btn" href="mypage.html">マイページ</a>
    </div>
  </div>
</main>
<script>
const q = new URLSearchParams(location.search);
const type = q.get('type');
const status = q.get('status');
const session = q.get('session');
const provider = q.get('provider');
const token = q.get('token'); // PayPal は承認後 ?token=ORDER_ID を付与して戻る
const num = q.get('num');
const $ = id => document.getElementById(id);
const yen = n => '¥' + Number(n).toLocaleString('ja-JP');
const payLabel = m => ({ stripe:'Stripe（各種クレジットカード・Apple Pay・コンビニ払い）', paypal:'PayPal', bank_transfer:'銀行振込（Stripe収納代行）', invoice:'請求書払い' }[m] || '');

function base(icon, title, msg) {
  $('icon').textContent = icon; $('title').textContent = title; $('msg').textContent = msg;
  $('btnRow').classList.remove('hidden');
}
function setNum(n) { if (!n) return; $('numLine').textContent = n; $('numWrap').classList.remove('hidden'); }
function setWarn(t) { $('warn').textContent = t; $('warn').classList.remove('hidden'); }
// 予約明細を表形式で表示（スクショで残せるように）
function renderDetails(b) {
  if (!b) return;
  setNum(b.bookingNumber);
  const dt = (b.items || []).map(i => i.date + ' ' + i.startTime + '〜' + i.endTime).join('<br>') || '—';
  const rows = [
    ['スペース', b.spaceName || '—'],
    ['ご利用日時', dt],
    ['イベント名', b.eventName || '—'],
    ['お支払い方法', payLabel(b.paymentMethod) || '—'],
  ];
  let html = rows.map(r => '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');
  html += '<div class="row total"><span class="k">合計（税込）</span><span class="v">' + yen(b.total || 0) + '</span></div>';
  $('details').innerHTML = html;
  $('details').classList.remove('hidden');
}

async function run() {
  // キャンセルで戻ってきた場合
  if (status === 'cancel') {
    base('⚠️', 'お支払いが中断されました', 'ご予約自体は「未入金」の状態で確保されています。');
    setNum(num);
    setWarn('お手数ですが、お支払いは改めて店舗までお問い合わせいただくか、後日ご案内するお支払い方法にてお願いいたします。');
    return;
  }
  // PayPal 承認後の戻り（?provider=paypal&token=ORDER_ID）→ サーバでキャプチャ
  if (type === 'booking' && provider === 'paypal' && token) {
    base('⏳', '確認しています…', 'PayPalのお支払いを確定しています。少しお待ちください。');
    try {
      const r = await fetch('/api/paypal/capture', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId: token }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.status === 'paid') {
        base('✅', 'お支払いが完了しました', 'ご予約とお支払いが確定しました。確認メールをお送りします。');
        renderDetails(j.booking);
      } else {
        base('⚠️', 'お支払いを確定できませんでした', j.error || 'お手数ですが、もう一度お試しいただくか店舗までお問い合わせください。');
      }
    } catch (e) {
      base('⚠️', 'お支払いの確認に失敗しました', 'お手数ですが、ご予約状況は店舗までご確認ください。');
    }
    return;
  }
  // 銀行振込（Stripe）: 戻り時点では未入金。振込先確認 → 入金後に確定・領収書発行。
  if (type === 'booking' && session && q.get('method') === 'bank') {
    let booking = null;
    const r = await fetch('/api/bookings/payment-status?session=' + encodeURIComponent(session));
    const j = await r.json().catch(() => ({}));
    booking = j.booking;
    if (j.status === 'paid') {
      base('✅', 'お支払いが完了しました', 'ご予約とお支払いが確定しました。領収書はマイページからダウンロードいただけます。');
    } else {
      base('🏦', 'お振込先をご確認ください', 'ご予約を確保しました。表示された振込専用口座へお振込みください。ご入金の確認後に予約が確定し、領収書を発行します。');
      setWarn('お振込みは前ページに表示された「専用口座」宛にお願いします。ご入金確認まで数営業日かかる場合があります。ご予約は確保されています。');
    }
    renderDetails(booking);
    return;
  }
  // 予約のカード決済（成功で戻ってきた）
  if (type === 'booking' && session) {
    let lastBooking = null;
    for (let i = 0; i < 12; i++) {
      const r = await fetch('/api/bookings/payment-status?session=' + encodeURIComponent(session));
      const j = await r.json().catch(() => ({}));
      if (j.booking) lastBooking = j.booking;
      if (j.status === 'paid') {
        base('✅', 'お支払いが完了しました', 'ご予約とお支払いが確定しました。確認メールをお送りします。');
        renderDetails(j.booking);
        return;
      }
      await new Promise(res => setTimeout(res, 1500));
    }
    // 反映待ち（Webhookが少し遅れている場合）
    base('✅', 'お支払いを受け付けました', 'ご予約は確定しています。反映まで少しお時間がかかる場合があります。');
    renderDetails(lastBooking);
    return;
  }
  base('ℹ️', '状態を確認できませんでした', 'お手数ですが、ご予約状況は確認メールまたは店舗までご確認ください。');
}
run();
</script>
</body>
</html>
