<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>オフライン｜レンタルスペースALBE 予約</title>
<link rel="stylesheet" href="/assets/tokens.css">
<style>
  :root { --brand:var(--key); }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--f-sans); color:var(--ink); background:var(--wash); line-height:1.7;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:32px 24px; max-width:400px; text-align:center; }
  .ic { font-size:48px; line-height:1; }
  h1 { font-size:19px; margin:14px 0 8px; }
  p { color:var(--ink-2); font-size:14px; margin:6px 0 0; }
  .btn { display:inline-block; margin-top:20px; background:var(--brand); color:#fff; border:0; border-radius:10px;
    padding:12px 24px; font-size:15px; font-weight:600; cursor:pointer; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <div class="ic">📶</div>
    <h1>オフラインです</h1>
    <p>インターネットに接続されていないため、ページを表示できませんでした。電波状況をご確認のうえ、もう一度お試しください。</p>
    <a class="btn" href="/" onclick="location.reload();return false;">再読み込み</a>
  </div>
</body>
</html>
